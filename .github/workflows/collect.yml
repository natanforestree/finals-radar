name: collect

on:
  schedule:
    # The Cloudflare Worker (worker/) triggers this every 10 minutes; GitHub's
    # own schedule is unreliable, so it's only an hourly backup, off the hour.
    - cron: "34 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Collect leaderboard + Twitch
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          REGION_KEY: ${{ secrets.REGION_KEY }}
        run: python3 collector/collect.py

      - name: Back up the lobby log (encrypted with the squad code)
        env:
          SQUAD_CODE: ${{ secrets.SQUAD_CODE }}
        run: |
          api=$(sed -n 's/^window.RUBY_RADAR_API = "\(.*\)";/\1/p' docs/config.js)
          if [ -z "$api" ] || [ -z "$SQUAD_CODE" ]; then echo "lobby log not configured"; exit 0; fi
          if ! curl -fsS --max-time 20 -H "X-Squad-Code: $SQUAD_CODE" "$api/api/lobbies" -o "$RUNNER_TEMP/lobbies.json"; then
            echo "lobby log unreachable; skipping backup"; exit 0
          fi
          sum=$(sha256sum "$RUNNER_TEMP/lobbies.json" | cut -c1-64)
          if [ "$sum" != "$(cat state/lobbies.sha256 2>/dev/null)" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:SQUAD_CODE \
              -in "$RUNNER_TEMP/lobbies.json" -out state/lobbies.json.enc
            echo "$sum" > state/lobbies.sha256
            echo "lobby log backed up"
          fi

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state archive
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -q
          done
          exit 1
