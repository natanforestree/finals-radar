# Ruby Radar Worker: lobby log API (D1) + a reliable 10-minute timer that
# asks GitHub to run the collect workflow. Runbook: README.md in this folder.
name = "ruby-radar"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ruby-radar"
# Created 2026-10-05 with `npx wrangler d1 create ruby-radar` (region WNAM).
database_id = "725df49b-cdcc-49af-a481-9cdd77fa23ae"

[vars]
GITHUB_REPO = "natanforestree/finals-radar"
GITHUB_WORKFLOW = "collect.yml"
RENO_TODAY_REPO = "natanforestree/reno-today"
RENO_TODAY_WORKFLOW = "collect.yml"

# Secrets (set with `npx wrangler secret put <NAME>`, never written here):
#   SQUAD_CODE    shared code the page sends as the X-Squad-Code header
#   GITHUB_TOKEN  fine-grained PAT: finals-radar + reno-today, Actions: read and write
